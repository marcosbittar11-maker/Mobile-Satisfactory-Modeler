/* v0.3.2: indicadores, ícones e sheets adaptados ao teclado */
.stat.actionable{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.stat.actionable:active{background:#30475b}
.stat.actionable:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.game-item-icon{display:inline-grid;place-items:center;width:100%;height:100%;min-width:0;min-height:0}
.game-item-icon img{width:100%;height:100%;max-width:36px;max-height:36px;object-fit:contain;filter:drop-shadow(0 1px 2px #0007)}
.game-item-icon .fallback{font-size:23px;line-height:1}
.machicon .game-item-icon img{max-width:35px;max-height:35px}
.pic .game-item-icon img{max-width:34px;max-height:34px}
.overlay{height:var(--visual-height,100dvh);top:var(--visual-top,0px);bottom:auto;transition:none}
.sheet{max-height:min(calc(var(--visual-height,100dvh) - 6px),820px)}
.sheetbody{min-height:0}
.alert-row{padding:10px 11px;margin:7px 0;border:1px solid #384b5e;border-radius:11px;background:#1b2b3a;font-size:12px;line-height:1.5}
.alert-row strong{display:block;color:#f6f8fc;font-size:12px;margin-bottom:3px}
.alert-row .alert-material{color:#ffcc89;font-weight:750}
.alert-row .alert-detail{color:#b2c5d9;margin-top:3px}
@media(max-width:365px){.hud{gap:4px}.stat{padding:6px 6px}}

/* v0.3.3: always-visible inline vector fallback, even under edge://external-file. */
.game-item-icon{position:relative;display:inline-grid;place-items:center;isolation:isolate;overflow:hidden}
.game-item-icon .fallback{grid-area:1/1;width:100%;height:100%;display:grid;place-items:center;font-size:0}
.game-item-icon .fallback svg{display:block;width:100%;height:100%;max-width:37px;max-height:37px}

// Infer a terminal demand when a user deliberately specifies raw-material
// availability but no downstream production target. Without this step, a terminal
// Storage (a passive sink) requests zero, stopping an otherwise complete factory.
// The estimator is a forward capacity pass over unanchored DAG components. It
// distributes shared upstream supply conservatively; it does not optimize cycles.
// v0.3: planejamento com propagação de metas para trás e vazões planejadas
// para a frente. A ausência de um insumo NÃO transforma uma fábrica projetada
// em produção zero; ela é indicada separadamente como pendência.
// O solver é específico para DAGs: reciclagem e feedback não são simulados.

   r.outs.forEach((p,j)=>addBal(p.item,'p',c.actualOuts?.[j]||0));r.ins.forEach((p,i)=>addBal(p.item,'c',c.actualIns?.[i]||0));}

 const typeRows=[...byType].sort((a,b)=>b[1].built-a[1].built).map(([k,t])=>`<div class="line"><span>${esc(k)}<div class="muted">${fmt(t.eq)} equivalentes${t.gen>1e-6?` · +${fmt(t.gen,1)} MW`:` · ${fmt(t.pw,1)} MW`}</div></span><b>${fmt(t.built,0)}</b></div>`).join('')||'<p class="muted">Nenhuma máquina nesta área.</p>';

  ${project.boards.length>1?`<div class="info">Projeto inteiro (todas as áreas): consumo ${fmt(s.projectPower,1)} MW${s.projectGen>1e-6?` · geração ${fmt(s.projectGen,1)} MW`:''}.</div>`:''}<div class="info">Consumo planejado inclui máquinas de energia variável pela média do ciclo, Somersloops e o multiplicador de energia${project.settings.powerMul!==1?` (${fmt(project.settings.powerMul)}×)`:''}. Fontes automáticas ou manuais não entram no consumo.</div>`,btn('Exportar CSV','csv')+btn('Fechar','close'))}

 const update=()=>{const item=Number($('genProduct').value),rr2=recs.filter(r=>!r.gen&&r.cat!==11&&r.outs.some(x=>x.item===item));const sel=$('genRecipe');sel.innerHTML=rr2.map(r=>`<option value="${r.id}">${esc(r.name)} · ${esc(machines[r.cat])}</option>`).join('')||'<option value="">Fonte externa</option>';const best=bestRecipeForItem(item);if(best)sel.value=String(best.id)};

function planChain(finalItem,finalRid,allowAlt){
 const choice=new Map();let count=0,cut=false;
 const visit=(item,path)=>{
  if(choice.has(item))return;
  if(sourceItems.includes(item)){choice.set(item,{kind:'source'});return;}
  let r=null;if(item===finalItem&&finalRid!=null)r=recs[finalRid];
  else{const ranked=rankRecipes(item,{avoid:path,allowAlt});r=(ranked.find(x=>!x.r.ins.some(y=>path.has(y.item)||y.item===item))||ranked[0])?.r||null;}
  if(!r||count>=160){choice.set(item,{kind:'external'});if(r)cut=true;return;}
  choice.set(item,{kind:'recipe',r});count++;const np=new Set(path);np.add(item);for(const p of r.ins)visit(p.item,np);
 };
 visit(finalItem,new Set());return{choice,cut};
}
function runGenerator(){
 const item=Number($('genProduct').value),rate=num($('genRate').value),recipeId=$('genRecipe').value===''?null:Number($('genRecipe').value),allowAlt=$('genAlt')?.checked;
 if(!Number.isFinite(rate)||rate<=0||rate>1000000){toast('Produção alvo deve ser positiva e finita.',true);return}
 const{choice,cut}=planChain(item,recipeId,allowAlt);
 const newp=emptyProject(`Fábrica de ${itemName(item)} — ${fmt(rate)}/min`),node=new Map(),E=newp.edges;
 const mk=o=>({id:id(),board:'root',x:0,y:0,clock:100,limit:null,target:null,portCaps:{},title:'',...o});
 for(const[it,ch]of choice){
  if(ch.kind==='recipe')node.set(it,mk({type:'recipe',rid:ch.r.id,rkey:ch.r.key,sloops:0}));
  else node.set(it,mk({type:'source',item:it,ikey:items[it].key,sourceMachine:'external',purity:1,sourceCount:1,sourceMode:'auto',limit:null,autoSupply:false,title:ch.kind==='external'?'Entrada externa: '+itemName(it):''}));
 }
 newp.nodes.push(...node.values());
 const outIndex=(n,it)=>n.type==='source'?0:recs[n.rid].outs.findIndex(o=>o.item===it);
 for(const[it,ch]of choice){if(ch.kind!=='recipe')continue;const n=node.get(it);ch.r.ins.forEach((p,ti)=>{const pr=node.get(p.item);if(pr)E.push({id:id(),board:'root',from:pr.id,fi:outIndex(pr,p.item),to:n.id,ti});});}
 const sinks=new Map();
 for(const[it,ch]of choice){if(ch.kind!=='recipe')continue;const n=node.get(it);
  ch.r.outs.forEach((p,fi)=>{if(p.item===it)return;const consumers=[...choice].filter(([,c2])=>c2.kind==='recipe'&&c2.r.ins.some(x=>x.item===p.item));
   for(const[i2,c2]of consumers)E.push({id:id(),board:'root',from:n.id,fi,to:node.get(i2).id,ti:c2.r.ins.findIndex(x=>x.item===p.item)});
   let s=sinks.get(p.item);if(!s){s=mk({type:'sink',item:p.item,ikey:items[p.item].key,title:'Excedente: '+itemName(p.item)});sinks.set(p.item,s);newp.nodes.push(s);}
   E.push({id:id(),board:'root',from:n.id,fi,to:s.id,ti:0});});}
 const fin=node.get(item),goal=mk({type:'output',item,ikey:items[item].key,target:rate,title:'Meta: '+itemName(item)});newp.nodes.push(goal);E.push({id:id(),board:'root',from:fin.id,fi:outIndex(fin,item),to:goal.id,ti:0});
 // Layout em colunas pela distância até a meta (maior caminho), recursos à esquerda.
 const depth=new Map(newp.nodes.map(n=>[n.id,0]));for(let k=0;k<newp.nodes.length;k++){let ch=false;for(const e of E){const d=Math.min(60,(depth.get(e.to)||0)+1);if(d>(depth.get(e.from)||0)){depth.set(e.from,d);ch=true;}}if(!ch)break;}
 for(const s of sinks.values()){const src=E.find(e=>e.to===s.id);depth.set(s.id,Math.max(0,(depth.get(src?.from)||1)-1));}
 const maxD=Math.max(...depth.values()),cols=new Map();for(const n of newp.nodes){const d=depth.get(n.id);if(!cols.has(d))cols.set(d,[]);cols.get(d).push(n);}
 const est=n=>{const p=n.type==='recipe'?{ins:recs[n.rid].ins,outs:recs[n.rid].outs}:{ins:n.type==='source'?[]:[1],outs:n.type==='sink'||n.type==='output'?[]:[1]};return 65+9+Math.max(1,p.ins.length,p.outs.length)*38+5+33;};
 for(const[d,list]of cols){let y=0;list.sort((a,b)=>(a.type==='sink')-(b.type==='sink')||nodeTitleSafe(a).localeCompare(nodeTitleSafe(b)));for(const n of list){n.x=(maxD-d)*330;n.y=y;y+=est(n)+36;}}
 project.cameras[project.current]=clone(camera);sanitizeProject(newp);projects.unshift(newp);project=newp;history=[];future=[];selected.clear();pending=null;normalizeProject();loadCamera();recompute(true);closeSheet();render();fitBoard();save();
 toast(`${newp.nodes.length} blocos gerados${cut?' (cadeia limitada)':''}`);
}

  const row=[n.type,nodeTitle(n),r?machines[r.cat]:nodeSubtitle(n),product,fmt(s.requestedOuts[0]||s.neededIns[0]||0),fmt(s.actualOuts[0]||s.actualIns[0]||0),fmt(s.wanted),fmt(s.machines),r?fmt((s.util||0)*100,1):'',s.sloops||0,s.shards||0,fmt(s.power),fmt(s.gen||0)];
  lines.push(row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';'))}

function exportPNG(){const ns=boardNodes(),es=boardEdges();if(!ns.length)return toast('Não há blocos para exportar.',true);
 const b={l:Math.min(...ns.map(n=>n.x))-80,t:Math.min(...ns.map(n=>n.y))-80,r:Math.max(...ns.map(n=>n.x+NODE_W))+80,bt:Math.max(...ns.map(n=>n.y+nodeHeight(n)))+90},W=b.r-b.l,H=b.bt-b.t,scale=Math.min(2,Math.max(.25,4000/Math.max(W,H)));
 const canvas=document.createElement('canvas');canvas.width=Math.ceil(W*scale);canvas.height=Math.ceil(H*scale);const c=canvas.getContext('2d');c.setTransform(scale,0,0,scale,-b.l*scale,-b.t*scale);c.fillStyle='#101822';c.fillRect(b.l,b.t,W,H);
 const rrect=(x,y,w,h,r)=>{c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);};
 c.strokeStyle='#ffffff13';c.lineWidth=1;for(let x=Math.floor(b.l/40)*40;x<b.r;x+=40){c.beginPath();c.moveTo(x,b.t);c.lineTo(x,b.bt);c.stroke()}for(let y=Math.floor(b.t/40)*40;y<b.bt;y+=40){c.beginPath();c.moveTo(b.l,y);c.lineTo(b.r,y);c.stroke()}
 for(const e of es){const f=nBy(e.from),t=nBy(e.to);if(!f||!t)continue;const p=portPosition(f,'out',e.fi),q=portPosition(t,'in',e.ti);c.beginPath();c.moveTo(p.x,p.y);c.bezierCurveTo(p.x+100,p.y,q.x-100,q.y,q.x,q.y);c.lineWidth=2;c.strokeStyle=calculated.edgeWarn?.[e.id]?'#ff6b6b':'#5db6b7';c.stroke();c.fillStyle='#a6d8d7';c.font='12px system-ui';c.textAlign='center';c.fillText(edgeLabel(e),(p.x+q.x)/2,(p.y+q.y)/2-10);}
 for(const n of ns){const h=nodeHeight(n),cc=calculated.nodes[n.id];c.fillStyle='#203144';c.strokeStyle='#677f92';c.lineWidth=2;rrect(n.x,n.y,NODE_W,h,10);c.fill();c.stroke();c.fillStyle='#fff';c.textAlign='left';c.font='bold 14px system-ui';c.fillText(nodeIconText(n)+' '+nodeTitle(n).slice(0,26),n.x+12,n.y+23);c.fillStyle='#9aadc0';c.font='12px system-ui';c.fillText(nodeSubtitle(n).slice(0,34),n.x+12,n.y+43);
  const p=ports(n);for(let i=0;i<p.ins.length;i++){c.fillStyle='#ffcf93';c.font='11px system-ui';c.fillText('‹ '+itemName(p.ins[i]).slice(0,14)+' '+fmt(cc?.actualIns[i]||0),n.x+10,portPosition(n,'in',i).y+4)}
  for(let i=0;i<p.outs.length;i++){c.fillStyle='#9de8df';c.font='11px system-ui';c.textAlign='right';c.fillText(fmt(cc?.actualOuts[i]||0)+' '+itemName(p.outs[i]).slice(0,13)+' ›',n.x+236,portPosition(n,'out',i).y+4);c.textAlign='left'}
  c.fillStyle='#f4f6fc';c.font='bold 14px system-ui';c.fillText(n.type==='recipe'?fmt(cc?.machines||0)+(recOf(n)?.gen?' gerador(es)':' máquina(s)'):'',n.x+12,n.y+h-10);}
 canvas.toBlob(blob=>{if(blob)offerFile(blob,safeName(project.name)+'.png');else toast('Falha ao gerar imagem',true)},'image/png');toast('Imagem PNG preparada');}
function importProjectText(text,filename){if(text.length>8*1024*1024)throw Error('Arquivo muito grande. Máximo de 8 MB.');const data=JSON.parse(text);let p;
 if(data.format==='factory-flow-mobile'&&data.project)p=data.project;
 else if(data&&Array.isArray(data.nodes)&&Array.isArray(data.edges))p=data;
 else if(data&&Array.isArray(data.Data)&&/\.sfmd$/i.test(filename)){
  p=emptyProject('Importado do Satisfactory Modeler');let guessed=0;
  for(const m of data.Data){if(!m?.Name)continue;const recipe=REC_BY_NAME[String(m.Name).toLowerCase()]||recs.find(r=>r.outs.some(o=>itemName(o.item).toLowerCase()===String(m.Name).toLowerCase())&&!r.alt);if(!recipe){guessed++;continue;}p.nodes.push({id:id(),board:'root',type:'recipe',rid:recipe.id,rkey:recipe.key,x:Number(m.X)||0,y:Number(m.Y)||0,title:typeof m.Title==='string'?m.Title:'',clock:100,limit:Number.isFinite(Number(m.Max))?Number(m.Max):null,target:null,portCaps:{}})}
  if(!p.nodes.length)throw Error('Nenhuma receita reconhecida neste .sfmd.');p._importNotes=`${p.nodes.length} receitas importadas, ${guessed} itens desconhecidos. As conexões .sfmd não são reconstruídas nesta versão.`;
 }else throw Error('Formato incompatível. Importe um backup JSON do Factory Flow ou um .sfmd do Modeler.');
 if(!p||!Array.isArray(p.nodes)||!Array.isArray(p.edges)||p.nodes.length>5000||p.edges.length>20000)throw Error('Estrutura inválida ou maior que o limite suportado.');
 // Arquivos antigos sem rkey dependem da posição da receita no catálogo: confere as ligações.
 const legacy=p.nodes.filter(n=>n?.type==='recipe'&&!n.recipe&&!n.rkey&&Number.isInteger(n.rid));
 if(legacy.length){const byId=new Map(p.nodes.map(n=>[n.id,n]));const outItem=(n,i)=>n?.type==='recipe'&&!n.recipe&&recs[n.rid]?recs[n.rid].outs[i]?.item:n?.type==='source'?n.item:null,inItem=(n,i)=>n?.type==='recipe'&&!n.recipe&&recs[n.rid]?recs[n.rid].ins[i]?.item:null;
  const bad=p.edges.filter(e=>{const a=outItem(byId.get(e.from),e.fi),b=inItem(byId.get(e.to),e.ti);return a!=null&&b!=null&&a!==b;}).length;
  if(bad)p._importNotes=`Arquivo de versão anterior sem chaves de receita: ${legacy.length} receita(s) foram associadas pela posição no catálogo e ${bad} ligação(ões) não combinam com os itens. Confira as receitas destacadas antes de usar os números.`;}
 p=sanitizeProject(clone(p));p.id=id();p.name=String(p.name||'Projeto importado').slice(0,100);p.created=Date.now();p.current='root';p.cameras=p.cameras||{};const notes=p._importNotes;delete p._importNotes;
 projects.unshift(p);project=p;history=[];future=[];selected.clear();pending=null;normalizeProject();loadCamera();recompute(true);render();save();closeSheet();if(data?.Data)fitBoard();toast('Arquivo importado'+(notes&&data?.Data?' (sem conexões)':''));
 if(notes)showSheet(data?.Data?'Importação parcial':'Confira a importação',p.name,`<div class="info orange">${esc(notes)}${data?.Data?'<br>Recrie as ligações manualmente ou use o arquivo de backup desta ferramenta para preservar a topologia.':''}</div>`,btn('Entendi','close'));
}
