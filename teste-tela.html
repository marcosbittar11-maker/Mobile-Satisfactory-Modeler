<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Factory Flow — página incorporada</title>
<style>body{font:16px system-ui;background:#0b121a;color:#e8f0f9;display:grid;place-items:center;min-height:100vh;text-align:center;margin:0;padding:20px}a{color:#ffb74d}</style>
</head><body><main><h1>Factory Flow</h1><p>A página de teste foi incorporada ao aplicativo principal.</p><a href="./index.html">Abrir Factory Flow</a></main>
<script>(function(){
try{
 const a='factory_flow_mobile_projects_v2_viewport_test',b='factory_flow_mobile_projects_v2';
 const old=JSON.parse(localStorage.getItem(a)||'[]');
 const current=JSON.parse(localStorage.getItem(b)||'[]');
 if(Array.isArray(old)&&Array.isArray(current)){
  const found=new Map(current.filter(x=>x&&typeof x.id==='string').map(x=>[x.id,JSON.stringify(x)]));
  let modified=false;
  old.forEach(item=>{
   if(!item||typeof item.id!=='string')return;
   const prior=found.get(item.id),serialized=JSON.stringify(item);
   if(prior===serialized)return;
   let copy=item;
   if(prior!==undefined){
    let n=1,id;do{id=item.id+'-teste-'+n++;}while(found.has(id));
    copy=Object.assign({},item,{id,name:(item.name||'Projeto')+' (teste)'});
   }
   current.push(copy);found.set(copy.id,JSON.stringify(copy));modified=true;
  });
  if(modified)localStorage.setItem(b,JSON.stringify(current));
  const active='factory_flow_mobile_active_v2',legacy='factory_flow_mobile_active_v2_viewport_test';
  if(!localStorage.getItem(active)){
   const id=localStorage.getItem(legacy);
   if(id&&current.some(x=>x.id===id))localStorage.setItem(active,id);
  }
 }
 [['factory_flow_ui_language_v1_viewport_test','factory_flow_ui_language_v1'],['factory_flow_templates_v1_viewport_test','factory_flow_templates_v1']].forEach(pair=>{
  if(!localStorage.getItem(pair[1])&&localStorage.getItem(pair[0]))localStorage.setItem(pair[1],localStorage.getItem(pair[0]));
 });
}catch(e){console.warn('Projetos antigos preservados. Migração não executada:',e);}
location.replace('./index.html');
})();</script></body></html>
